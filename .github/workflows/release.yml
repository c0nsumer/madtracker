# Builds the Windows portable zip and installer, the macOS dmg and zip, and
# the Linux tarball. A v* tag publishes a GitHub Release with the files and
# their SHA-256 sums. A manual run only uploads workflow artifacts, named
# with the commit's short hash, so a candidate can be tried before tagging;
# it can build one platform alone and skips the suite by default, since the
# suite has passed locally and in ci.yml before a candidate is pushed.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platform:
        description: Which packages to build
        type: choice
        options: [all, windows, macos, linux]
        default: all
      skip_tests:
        description: Skip the suite inside each build script
        type: boolean
        default: true

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Short commit hash
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build
        shell: pwsh
        run: if ('${{ inputs.skip_tests }}' -eq 'true') { ./packaging/build_windows.ps1 -SkipTests } else { ./packaging/build_windows.ps1 }
      - uses: actions/upload-artifact@v4
        with:
          name: MadTracker-windows-${{ steps.commit.outputs.short }}
          path: |
            dist/MadTracker-*-portable.zip
            dist/MadTracker-*-setup.exe
          if-no-files-found: error
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MadTracker-*-portable.zip
            dist/MadTracker-*-setup.exe

  macos:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    # Pinned rather than macos-latest, so the build and its Xcode do not
    # change when latest moves to a new macOS. Apple silicon only: newer
    # Macs only, and no Intel build.
    runs-on: macos-26
    permissions:
      contents: write
    env:
      # Icon Composer's .icon needs Xcode 26's actool; recheck the path in
      # the runner image's README when moving to a new image.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # The build fails rather than fall back to the .iconset, so a green
      # run means the app carries the icon macOS 26 draws with its glass.
      MADTRACKER_REQUIRE_ICON: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Short commit hash
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # Unsigned unless the signing secrets are added to the job env; see
        # the comments in packaging/build_macos.sh.
        run: |
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            ./packaging/build_macos.sh --skip-tests
          else
            ./packaging/build_macos.sh
          fi
      - name: Check the icon
        run: |
          app=dist/MadTracker.app
          test -f "$app/Contents/Resources/Assets.car"
          test "$(plutil -extract CFBundleIconName raw "$app/Contents/Info.plist")" = madtracker
          tools/check_macos_icon.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MadTracker-macos-${{ steps.commit.outputs.short }}
          path: |
            dist/MadTracker-*.dmg
            dist/MadTracker-*-macos.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-check-${{ steps.commit.outputs.short }}
          path: |
            build/icon-check/report.txt
            build/icon-check/preview.png
          if-no-files-found: ignore
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MadTracker-*.dmg
            dist/MadTracker-*-macos.zip

  linux:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Short commit hash
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        # Qt's xcb plugin loads these at startup, including under the
        # offscreen self-test on a bare runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - name: Build
        run: |
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            ./packaging/build_linux.sh --skip-tests
          else
            ./packaging/build_linux.sh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MadTracker-linux-${{ steps.commit.outputs.short }}
          path: dist/MadTracker-*-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MadTracker-*-linux-x86_64.tar.gz

  checksums:
    # The SHA-256 of every package built, so a download can be checked; on
    # a tag, the file is attached and the sums go in the release notes.
    needs: [windows, macos, linux]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Short commit hash
        id: commit
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: MadTracker-*
          path: packages
          merge-multiple: true
      - name: Sum
        working-directory: packages
        run: |
          sha256sum * > ../SHA256SUMS.txt
          {
            echo '## SHA-256'
            echo
            echo '```'
            cat ../SHA256SUMS.txt
            echo '```'
          } > ../sums.md
          cat ../SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-${{ steps.commit.outputs.short }}
          path: SHA256SUMS.txt
      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS.txt
          body_path: sums.md
          append_body: true
