# The whole suite, headless, on Windows, macOS, and Linux on every push:
# all three are first-class targets, so Qt, SQLite, and path handling are
# exercised on each. Packaging is release.yml's job.
name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check madtracker/ tests/
      - run: pytest -q -p no:cacheprovider -o faulthandler_timeout=90
        env:
          QT_QPA_PLATFORM: offscreen
